name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'
  NODE_VERSION: '20'
  PNPM_VERSION: '9.12.0'

jobs:
  # ──────────────────────────────────────────────────────────────────────────────
  # Stage 1 — Static analysis (lint, format, typecheck) & hygiene
  # ──────────────────────────────────────────────────────────────────────────────
  repo-hygiene:
    name: Repo hygiene (no build residue)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Reject Docker build residue in repository
        run: bash infra/scripts/verify-no-root-artifacts.sh

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm -w lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -w typecheck

  # ──────────────────────────────────────────────────────────────────────────────
  # Stage 2 — Unit & integration tests
  # ──────────────────────────────────────────────────────────────────────────────
  test:
    name: Unit / Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -w test

  # ──────────────────────────────────────────────────────────────────────────────
  # Stage 3 — Build (required before E2E, Trivy and SBOM)
  # ──────────────────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [repo-hygiene, lint, typecheck, test]
    timeout-minutes: 20
    env:
      VITE_API_BASE_URL: 'http://localhost/api'
      VITE_SUPABASE_URL: 'http://localhost:54321'
      VITE_SUPABASE_ANON_KEY: 'placeholder'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -w build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 1

  # ──────────────────────────────────────────────────────────────────────────────
  # Stage 4 — E2E (Playwright)
  # ──────────────────────────────────────────────────────────────────────────────
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 20
    env:
      VITE_API_BASE_URL: 'http://localhost/api'
      VITE_SUPABASE_URL: 'http://localhost:54321'
      VITE_SUPABASE_ANON_KEY: 'placeholder'
      PLAYWRIGHT_BASE_URL: 'http://localhost:5173'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
      - name: Install Playwright browsers
        run: |
          pnpm --filter @coast-academy/web exec playwright install chromium firefox
          pnpm --filter @coast-academy/web exec playwright install-deps chromium firefox || true
      - name: Run E2E tests
        run: pnpm --filter @coast-academy/web test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────────
  # Stage 5 — Docker Compose validation
  # ──────────────────────────────────────────────────────────────────────────────
  docker-compose-validate:
    name: Validate docker-compose
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Stub local env files required by compose
        run: touch .env.local
      - name: Create external Supabase network stub (CI has no local Supabase)
        run: docker network create supabase_network_coast-academy || true
      - run: docker compose config -q

  # ──────────────────────────────────────────────────────────────────────────────
  # Stage 6 — Security: pnpm audit + Trivy container scan + SBOM
  # ──────────────────────────────────────────────────────────────────────────────
  security-audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod || true

  trivy-scan:
    name: Trivy — Container Scan
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Build web image (for scanning)
        run: |
          docker build \
            --build-arg SERVICE_NAME=web \
            -f infra/docker/Dockerfile.web \
            -t coast-academy-web:ci .
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: coast-academy-web:ci
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'
      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-container

  sbom:
    name: SBOM (Syft)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Generate SBOM (SPDX JSON)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-spdx
          path: sbom.spdx.json
          retention-days: 30
